<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Оплата — Нихао, дети!</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
<meta name="theme-color" content="#6C3FC5">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Onest:wght@400;500;700;800&family=Noto+Sans+SC:wght@900&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F1E6;--paper2:#EDE6D6;--ink:#1F1B17;--ink2:#4A423B;--mute:#7A6F63;--p:#6C3FC5;--honey:#F5C842;--honey2:#E0B32E;--red:#D8432B;
 --f:"Onest",system-ui,sans-serif;--d:"Unbounded",var(--f);--zh:"Noto Sans SC","PingFang SC",sans-serif;--ease:cubic-bezier(.2,.9,.25,1.1)}
*{box-sizing:border-box}html{background:var(--paper)}
body{margin:0;font-family:var(--f);color:var(--ink);background:var(--paper);line-height:1.5;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 60px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--d);font-weight:900;font-size:18px;color:var(--ink);text-decoration:none}
.logo .zh{font-family:var(--zh);font-weight:900;color:#fff;background:var(--red);width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:16px;transform:rotate(-6deg)}
.logo b{color:var(--p)}
.back{font-weight:700;font-size:14px;color:var(--ink2);text-decoration:none}
h1{font-family:var(--d);font-weight:900;font-size:clamp(26px,5vw,36px);letter-spacing:-.02em;line-height:1.08;margin:14px 0 6px}
.sub{color:var(--ink2);margin:0 0 20px}
.card{background:#fff;border-radius:26px;padding:24px;box-shadow:0 14px 30px rgba(31,27,23,.10);border:1px solid rgba(31,27,23,.06)}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.plan{position:relative;border:2px solid rgba(31,27,23,.12);border-radius:18px;padding:14px 14px 12px;cursor:pointer;background:var(--paper)}
.plan input{position:absolute;opacity:0;pointer-events:none}
.plan b{display:block;font-family:var(--d);font-size:15px;margin-bottom:2px}
.plan .sum{font-family:var(--d);font-weight:900;font-size:24px;letter-spacing:-.02em;color:var(--ink)}
.plan small{display:block;color:var(--mute);font-size:12px;line-height:1.3;margin-top:4px}
.plan:has(input:checked){border-color:var(--p);background:#F7F3FF;box-shadow:0 0 0 3px rgba(108,63,197,.12)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:14px}
.field label span{color:var(--mute);font-weight:500}
.field input{font:inherit;font-size:16px;padding:13px 14px;border-radius:14px;border:2px solid rgba(31,27,23,.14);background:var(--paper);color:var(--ink);width:100%}
.field input:focus{border-color:var(--p);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 22px;border-radius:999px;font-weight:800;font-size:17px;text-decoration:none;border:0;cursor:pointer;font-family:inherit;color:var(--ink);background:var(--honey);box-shadow:0 10px 24px rgba(224,179,46,.35),0 2px 0 var(--honey2);transition:transform .15s var(--ease)}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.6;cursor:default}
.btn.ink{background:var(--ink);color:#fff;box-shadow:none}
.fine{font-size:13px;color:var(--mute);margin:12px 0 0;line-height:1.5}
.fine a{color:var(--p)}
.msg{display:none;margin-top:12px;padding:12px 14px;border-radius:12px;font-weight:700}
.msg.err{display:block;background:#FDE8E8;color:#9B2C2C}
.pay-icons{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.pay-icons span{font-size:12px;font-weight:700;color:var(--ink2);background:var(--paper);border:1px solid rgba(31,27,23,.1);border-radius:999px;padding:5px 10px}
/* результат */
.done{text-align:center}
.done .big{font-family:var(--zh);font-weight:900;font-size:64px;line-height:1;color:var(--p);margin:6px 0}
.code{font-family:var(--d);font-weight:900;font-size:clamp(28px,8vw,40px);letter-spacing:.04em;padding:14px 20px;border-radius:18px;background:var(--honey);display:inline-block;margin:10px 0 6px;user-select:all}
.done p{color:var(--ink2);margin:6px 0 14px}
.spin{width:28px;height:28px;border:3px solid rgba(108,63,197,.2);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{font-size:14px;color:var(--mute);margin-top:16px}
.links{display:grid;gap:10px;margin-top:14px}
.links a{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--paper);color:var(--ink);text-decoration:none;font-weight:700;border:1px solid rgba(31,27,23,.08)}
@media(max-width:480px){.plans{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
 <header class="top"><a class="logo" href="/"><span class="zh">你好</span>Нихао, <b>дети!</b></a><a class="back" href="/#price">← на главную</a></header>
 <div id="app"></div>
</div>
<script>
(function(){
 // две двери к серверу: российский шлюз первым, Cloudflare запасным
 var SRV=['https://d5d6o4mldv5m1nj5hvih.6brbn2wz.apigw.yandexcloud.net/zhpay','https://ss-bb.o-sintsova.workers.dev/zhpay'];
 var q=new URLSearchParams(location.search), app=document.getElementById('app');
 var ls={get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
 function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
 function post(path,body){ // первый успешный ответ из двух адресов
  return new Promise(function(res,rej){ var left=SRV.length, lastErr;
   SRV.forEach(function(s){ var ctl=new AbortController(); var tm=setTimeout(function(){ctl.abort();},20000);
    fetch(s+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal})
     .then(function(r){clearTimeout(tm);return r.json();}).then(function(j){ if(j&&(j.payment_url||'paid' in j)) res(j); else { lastErr=j; if(--left===0) rej(j); } })
     .catch(function(e){ clearTimeout(tm); lastErr=e; if(--left===0) rej(lastErr); }); }); });
 }


 function renderForm(fail){
  var want=q.get('plan'); var saved=null; try{ saved=JSON.parse(ls.get('zhOk')||'null'); }catch(e){}
  var l2code=(saved&&saved.plan==='lesson2'&&saved.code)?saved.code:(want==='module_up'?(ls.get('zhCode')||''):'');
  var plan=(want==='lesson2')?'lesson2':(l2code?'module_up':'module');
  app.innerHTML='<h1>'+(l2code?'Открыть все уроки':'Открыть следующие уроки')+'</h1><p class="sub">Оплата картой или по СБП через Т-Банк. Код доступа появится на этом экране сразу после оплаты.</p>'
   +'<form class="card" id="f">'
   +'<div class="plans">'
   +(l2code
     ? '<label class="plan"><input type="radio" name="plan" value="module_up" checked><b>Модуль 1 · доплата</b><span class="sum">1 791 ₽</span><small>Все 8 уроков, 2 серии сериала, карточки. Ваши 199 ₽ за урок 2 засчитаны. Код '+esc(l2code)+' останется тот же.</small></label>'
     : '<label class="plan"><input type="radio" name="plan" value="lesson2"'+(plan==='lesson2'?' checked':'')+'><b>Урок 2</b><span class="sum">199 ₽</span><small>«Как тебя зовут?» — слова, игра, песня, иероглиф. Потом эти 199 ₽ засчитаем при покупке модуля.</small></label>'
      +'<label class="plan"><input type="radio" name="plan" value="module"'+(plan==='module'?' checked':'')+'><b>Модуль 1</b><span class="sum">1 990 ₽</span><small>8 уроков, 2 серии сериала, карточки, прописи. Доступ без срока.</small></label>')
   +'</div>'
   +'<div class="field"><label for="email">Электронная почта <span>· сюда придёт чек</span></label><input id="email" type="email" inputmode="email" autocomplete="email" required placeholder="mama@example.ru"></div>'
   +'<div class="field"><label for="child">Имя ребёнка <span>· необязательно</span></label><input id="child" autocomplete="off" placeholder="Маша"></div>'
   +'<div class="field"><label for="phone">Телефон <span>· если что-то пойдёт не так, напишем</span></label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7"></div>'
   +'<button class="btn" id="go" type="submit">Перейти к оплате</button>'
   +'<div class="msg" id="msg">'+(fail?'Оплата не прошла или была отменена. Можно попробовать ещё раз.':'')+'</div>'
   +'<div class="pay-icons"><span>Карта МИР</span><span>Visa · Mastercard</span><span>СБП</span><span>Чек на почту</span></div>'
   +'<p class="fine">Нажимая «Перейти к оплате», вы соглашаетесь с <a href="https://speakandsmile.ru/privacy.html">политикой обработки персональных данных</a>. Продавец: ИП Синцова О. В. Доступ на семью, до 3 устройств.</p>'
   +'</form>';
  if(fail){ document.getElementById('msg').className='msg err'; }
  var f=document.getElementById('f'), btn=document.getElementById('go'), msg=document.getElementById('msg');
  f.addEventListener('submit',function(e){ e.preventDefault();
   var email=document.getElementById('email').value.trim(), child=document.getElementById('child').value.trim(), phone=document.getElementById('phone').value.trim();
   var p=f.querySelector('input[name=plan]:checked').value;
   if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.className='msg err'; msg.textContent='Проверьте адрес почты: на него придёт чек.'; return; }
   btn.disabled=true; btn.textContent='Готовим оплату…'; msg.className='msg';
   post('/pay/create',{product:'nihao',plan:p,email:email,child:child,phone:phone,code:(p==='module_up'?l2code:'')}).then(function(j){
    ls.set('zh_order',JSON.stringify({order_id:j.order_id,claim:j.claim,plan:p,at:Date.now()})); try{ localStorage.removeItem('zhOk'); }catch(e){}
    location.href=j.payment_url;
   }).catch(function(e){ btn.disabled=false; btn.textContent='Перейти к оплате'; msg.className='msg err';
    msg.textContent='Не получилось связаться с платёжным сервером. Попробуйте ещё раз через минуту или напишите нам «НИХАО» в Telegram.'; });
  });
 }

 function renderChecking(order){
  var saved=null; try{ saved=JSON.parse(ls.get('zh_order')||'null'); }catch(e){}
  app.innerHTML='<div class="card done"><div class="big" lang="zh">谢谢</div><h1>Проверяем оплату…</h1><div class="spin"></div><p>Обычно это занимает несколько секунд.</p></div>';
  if(!saved||saved.order_id!==order){
   app.innerHTML='<div class="card done"><div class="big" lang="zh">你好</div><h1>Оплата принята</h1><p>Этот экран открыт не на том устройстве, где начиналась оплата, поэтому код показать не можем. Напишите нам «НИХАО» и почту, на которую оформляли, и пришлём код в ответ.</p><div class="links"><a href="https://t.me/SPeakSmilebot">Telegram</a><a href="https://max.ru/id245718463277_bot">MAX</a></div></div>';
   return;
  }
  var tries=0;
  (function poll(){
   post('/pay/status',{order_id:order,claim:saved.claim}).then(function(j){
    if(j.paid&&j.key){ renderDone(j.key,saved.plan); return; }
    if(j.paid&&!j.key){ if(tries<20){ tries++; setTimeout(poll,4000); } else renderNoCode(); return; }
    if(tries<30){ tries++; setTimeout(poll,3000); } else renderNotYet(order);
   }).catch(function(){ if(tries<30){ tries++; setTimeout(poll,4000); } else renderNotYet(order); });
  })();
 }
 function renderDone(code,plan){
  ls.set('zhCode',code);
  app.innerHTML='<div class="card done"><div class="big" lang="zh">太棒了!</div><h1>Готово! Уроки открыты</h1>'
   +'<p>Код вашей семьи. Сохраните его: по нему входят с других устройств.</p><div class="code">'+esc(code)+'</div>'
   +'<p>'+(plan==='lesson2'?'Урок 2 открыт. Понравится — модуль 1 со скидкой на эти 199 ₽.':'Модуль 1: все 8 уроков без срока.')+' Чек придёт на почту.</p>'
   +'<a class="btn" href="/uroki/?k='+encodeURIComponent(code)+'">Открыть уроки</a>'
   +'<p class="hint">На другом устройстве: откройте nihao-deti.ru/uroki/ и введите код. Потерялся код — напишите нам «НИХАО», восстановим по почте.</p></div>';
 }
 function renderNoCode(){
  app.innerHTML='<div class="card done"><div class="big" lang="zh">你好</div><h1>Оплата прошла</h1><p>Код создаётся дольше обычного. Обновите страницу через минуту, или напишите нам «НИХАО», пришлём код вручную.</p><div class="links"><a href="javascript:location.reload()">Обновить</a><a href="https://t.me/SPeakSmilebot">Telegram</a></div></div>';
 }
 function renderNotYet(order){
  app.innerHTML='<div class="card done"><div class="big" lang="zh">…</div><h1>Платёж ещё не подтверждён</h1><p>Банк иногда подтверждает оплату с задержкой в пару минут. Нажмите «Проверить ещё раз». Если деньги списались, а код не пришёл, напишите нам «НИХАО», номер заказа '+esc(order)+'.</p><div class="links"><a href="javascript:location.reload()">Проверить ещё раз</a><a href="https://t.me/SPeakSmilebot">Telegram</a></div></div>';
 }

 if(q.get('order')) renderChecking(q.get('order'));
 else renderForm(q.get('pay')==='fail');
})();
</script>
</body></html>
